<div id="conf-interface" class="interface-tab grid grid-row-2">
  <!-- Interface Config -->
  <div class="bg-white rounded-lg border shadow p-5 space-y-4 mb-4">
    <div class="flex flex-row justify-between align-middle">
      <h2 class=""><i class="fa-solid fa-server"></i>Interface Configuration</h2>
      <div>
        <button class="mt-3 border border-red-600 text-red-600 px-4 py-2 rounded-md text-sm ">
          <i class="fa-solid fa-arrows-rotate"></i> Reset
        </button>
        <button class="mt-3 text-black px-4 py-2 text-green-500 rounded-md text-sm border border-green-500 ml-2">
          <i class="fa-solid fa-floppy-disk"></i> Save
        </button>
      </div>
    </div>

    <div class="grid md:grid-cols-2 gap-4">
      <div>
        <label class="text-sm text-gray-600"> Interface Name</label>
        <input type="text" value="wg0" class="w-full border rounded-md px-3 py-2 text-sm bg-gray-100" readonly />
      </div>
      <div>
        <label class="text-sm text-gray-600">Listen Port</label>
        <input type="text" value="51820" class="w-full border rounded-md px-3 py-2 text-sm bg-gray-100" />
      </div>
    </div>

    <div>

      <div class="flex justify-between items-center mb-1">
        <label class="text-sm text-gray-600">Private Key</label>

        <button class="px-3 py-2 border rounded-md text-sm"> <i class="fa-solid fa-key"></i>
          Generate New Key
        </button>

      </div>
      <input type="password" value="*********************************"
        class="w-full border rounded-md px-3 py-2 text-sm bg-gray-100" disabled />
    </div>

    <div class="grid md:grid-cols-2 gap-4">
      <div>
        <label class="text-sm text-gray-600">Server Address</label>
        <input type="text" value="10.0.0.1/24" class="w-full border rounded-md px-3 py-2 text-sm bg-gray-100" />
      </div>
      <div>
        <label class="text-sm text-gray-600">MTU Size</label>
        <input type="text" value="1420" class="w-full border rounded-md px-3 py-2 text-sm bg-gray-100" />
      </div>
    </div>

    <div>
      <label class="text-sm text-gray-600">DNS Servers (comma-separated)</label>
      <input type="text" value="1.1.1.1, 8.8.8.8" class="w-full border rounded-md px-3 py-2 text-sm bg-gray-100" />
    </div>
  </div>
</div>
