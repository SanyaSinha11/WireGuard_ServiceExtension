<div id="conf-security" class="interface-tab grid grid-row-2  ">
  <!-- Interface Config -->
  <div class="bg-white rounded-lg border shadow p-5 space-y-4 mb-4">
    <div class="flex flex-row justify-between align-center">
      <div class="flex flex-col">
        <h2 class="font-semibold"> <i class="fa-solid fa-terminal"></i> Advance Configuration</h2>
        <h4>Custom Scripts that run before and after interface startup/shutdown</h4>
      </div>
      <div>
        <button class="mt-3 border border-red-600 text-red-600 px-4 py-2 rounded-md text-sm ">
          <i class="fa-solid fa-arrows-rotate"></i> Reset
        </button>
        <button class="mt-3 text-black px-4 py-2 text-green-500 rounded-md text-sm border border-green-500 ml-2">
          <i class="fa-solid fa-floppy-disk"></i> Save
        </button>
      </div>
    </div>

    <div class="grid md:grid-cols-1 gap-4">

      <div>
        <label class="text-sm text-gray-600">PreUp Script</label>
        <input type="text" value="#!/bin/bash&#10;echo 'Starting interface...'"
          class="w-full border rounded-md px-3 py-2 text-sm bg-gray-100" />

      </div>
      <div>
        <label class="text-sm text-gray-600">PostUp Script</label>
        <input type="text" value="#!/bin/bash&#10;echo 'Starting interface...'"
          class="w-full border rounded-md px-3 py-2 text-sm bg-gray-100" />

      </div>
      <div>
        <label class="text-sm text-gray-600">PreDown Script</label>
        <input type="text" value="#!/bin/bash&#10;echo 'Starting interface...'"
          class="w-full border rounded-md px-3 py-2 text-sm bg-gray-100" />

      </div>
      <div>
        <label class="text-sm text-gray-600">PostDown Script</label>
        <input type="text" value="#!/bin/bash&#10;echo 'Starting interface...'"
          class="w-full border rounded-md px-3 py-2 text-sm bg-gray-100" />

      </div>
    </div>


  </div>
</div>
