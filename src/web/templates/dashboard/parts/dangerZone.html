<!-- Danger Zone -->
<div
  class="bg-white rounded-lg border border-red-300 shadow-md p-6 mb-2 flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
  <!-- Description -->
  <div>
    <h2 class="text-xl font-bold text-red-600 flex items-center gap-2">
      <i class="fa-solid fa-triangle-exclamation"></i> Danger Zone
    </h2>
    <p class="text-sm text-gray-700 mt-2">
      You are managing critical actions for the interface
      <span class="font-mono bg-gray-100 px-1 py-0.5 rounded text-red-600">wg0</span>.
    </p>
    <p class="text-xs text-gray-500 mt-1">
      These operations can interrupt connectivity or reset configurations.
      Proceed with caution, especially in production environments.
    </p>
  </div>

  <!-- Action Buttons -->
  <div class="flex flex-wrap gap-3">
    <!-- Restart Button -->
    <button
      class="flex items-center gap-2 border border-red-600 text-red-600 hover:bg-red-700 hover:text-white px-4 py-2 rounded-md text-sm shadow-sm">
      <i class="fa-solid fa-rotate-right"></i>
      Restart Interface
    </button>

    <!-- Stop Button -->
    <button
      class="flex items-center gap-2 border border-yellow-500 text-yellow-500 hover:bg-yellow-600 hover:text-white px-4 py-2 rounded-md text-sm shadow-sm">
      <i class="fa-solid fa-circle-stop"></i>
      Stop Interface
    </button>

    <!-- Delete Button -->
    <button
      class="flex items-center gap-2 border border-red-600 text-red-600 hover:bg-red-700 hover:text-white px-4 py-2 rounded-md text-sm">
      <i class="fa-regular fa-trash-can"></i>
      Delete Interface
    </button>
  </div>
</div>
