{% extends "base.html" %} {% block content %}
<div class="flex h-screen">
    {% include 'sidebar.html' %}
    <!-- Main Content -->
    <main class="flex-1 flex flex-col m-3 bg-white shadow-lg rounded-lg overflow-hidden">
        {% include 'header.html' %}

        <!-- Server Config Section -->
        <div class="p-4">
            <h2 class="text-2xl font-bold mb-2">Peer Management</h2>
            <p class="text-gray-600 mb-2">
                Create and manage client configurations for the WireGuard server
            </p>
            <div class="flex flex-col   mb-4 p-4">

                <!-- Interface Management -->
                <div
                    class="flex flex-col md:flex-row justify-between items-start md:items-center border p-5 rounded-lg mb-6 bg-white shadow-sm gap-4">

                    <!-- Left section: Icon, title, select -->
                    <div class="flex flex-row justify-between w-full">
                        <div class="flex items-center gap-2 text-gray-800 text-md  mb-2">
                            <i class="fa-solid fa-desktop"></i>
                            Interface
                        </div>

                        <select id="interfaceSelect" name="interfaceSelect"
                            class="w-full md:w-64 border border-gray-300 rounded-md px-3 py-2 text-sm bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="" disabled selected>Select Interface</option>
                            <option value="option1">Option 1</option>
                            <option value="option2">Option 2</option>
                            <option value="option3">Option 3</option>
                        </select>
                    </div>

                </div>


                <!-- Dynamic content area -->
                <div id="configuration-content">
                    {% include 'dashboard/peer-mng/peer-list.html' %}
                </div>
            </div>



    </main>
</div>
{% endblock %} {% block scripts %}
{% endblock %}
