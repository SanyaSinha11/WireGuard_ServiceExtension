[Interface]
# Essential Keys
PrivateKey = <YOUR_PRIVATE_KEY>

# Network Addresses
Address = 10.0.0.1/24, fd86:ea04:1111::1/64

# Listen Port (UDP)
ListenPort = 51820

# DNS (for clients, ignored by server)
DNS = 1.1.1.1, 8.8.8.8

# MTU (default: autodetect)
MTU = 1420

# Routing Table (default: auto)
Table = auto

# Firewall Mark (advanced, for policy routing)
FwMark = 0xC0FFEE

# PostUp & PostDown (run scripts after interface activation/deactivation)
PostUp = iptables -A FORWARD -i %i -j ACCEPT
PostDown = iptables -D FORWARD -i %i -j ACCEPT

# PreUp & PreDown (run scripts before activation/deactivation)
PreUp = echo "Interface is coming up"
PreDown = echo "Interface is going down"

# SaveConfig (auto-save config on changes, only on Linux)
SaveConfig = true

# Optional: Description (not natively supported by WireGuard, but some managers allow)
# Description = "Main WireGuard VPN Interface"

[Peer]
# Essential Peer PublicKey
PublicKey = <PEER_PUBLIC_KEY>

# Optional: Preshared Key (for extra security)
PresharedKey = <PEER_PRESHARED_KEY>

# Endpoint (host:port of peer)
Endpoint = vpn.example.com:51820

# Allowed IPs (what traffic goes through the tunnel)
AllowedIPs = 10.0.0.2/32, fd86:ea04:1111::2/128, 0.0.0.0/0, ::/0

# PersistentKeepalive (for NAT traversal, recommended for mobile clients)
PersistentKeepalive = 25

# Optional: Description (not natively supported by WireGuard, but some managers allow)
# Description = "Peer 1"

# Multiple [Peer] sections can be added for each remote peer.

# Example: Additional Peer
#[Peer]
#PublicKey = <SECOND_PEER_PUBLIC_KEY>
#AllowedIPs = 10.0.0.3/32
#Endpoint = secondvpn.example.com:51820
#PersistentKeepalive = 30
